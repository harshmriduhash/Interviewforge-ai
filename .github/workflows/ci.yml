name: CI — Lint, Build & Validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: interviewforge-ai-web/package-lock.json

      - name: Install dependencies
        working-directory: interviewforge-ai-web
        run: npm ci

      - name: Generate Prisma client
        working-directory: interviewforge-ai-web
        run: npx prisma generate

      - name: Run ESLint
        working-directory: interviewforge-ai-web
        run: npm run lint
        continue-on-error: true

      - name: Build application
        working-directory: interviewforge-ai-web
        env:
          # Dummy env vars for build validation only
          DATABASE_URL: "postgresql://user:pass@localhost:5432/test"
          NEXTAUTH_SECRET: "ci-test-secret-key-not-for-production"
          NEXTAUTH_URL: "http://localhost:3000"
        run: npm run build

      - name: Verify build output
        working-directory: interviewforge-ai-web
        run: |
          echo "✅ Build completed successfully"
          ls -la .next/ | head -10
